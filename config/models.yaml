# Manifest model AI tải bằng `make models` (`postcare models`) vào models/ (không commit).
# Nguồn: F11 R1, R2; ADR-0003; QA#35. Model MediaPipe pretrained, không train, không đổi trọng số.
# URL có số phiên bản cố định (.../float16/1/...), không dùng `latest`, để sha256 không đổi.
# Đổi URL thì chạy lại `make models` và cập nhật sha256 (sha256sum / Get-FileHash).

version: 1
pose:
  # Biến thể dùng khi không truyền --model. Chọn bằng benchmark F11 (tech-stack.md
  # "Kết quả đo hiệu năng"): biến thể chính xác nhất đạt >= 10 FPS ở 720p trên CPU máy dev (A07).
  default: full
  variants:
    - name: lite
      url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
      filename: pose_landmarker_lite.task
      sha256: 59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a
    - name: full
      url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task
      filename: pose_landmarker_full.task
      sha256: 5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1
    - name: heavy
