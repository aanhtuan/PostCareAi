# Alembic (F01; ADR-0004). Chạy trong server/: `uv run alembic upgrade head` (make db-upgrade).
# URL DB lấy từ biến DATABASE_URL (hoặc file .env), không ghi ở đây.

[alembic]
script_location = %(here)s/src/postcare/db/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
