[project]
name = "postcare"
version = "0.1.0"
description = "PostCare AI - prototype đề xuất (backend API, CLI giả lập)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30,<2.1",
    "pyjwt>=2.8",
    "pwdlib[bcrypt]>=0.2",
    "typer>=0.12",
    "httpx>=0.27",
    "tzdata>=2024.1",
    # EngineConfig đọc config/engine.default.yaml (F10); test_tooling.py cũng dùng
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PostgreSQL thay cho SQLite mặc định: `uv sync --extra postgres`
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
postcare = "postcare.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=2.4",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "honcho>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postcare"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["vision: cần model MediaPipe và video thật (make test-vision)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with:Warning"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["postcare.schemas", "postcare.engine"]
plugins = ["pydantic.mypy"]

# PyYAML không kèm type stub; không thêm types-PyYAML (F10), safe_load trả Any và được validate bằng Pydantic.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
