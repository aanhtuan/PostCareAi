# CI (F00 R13; QA#8). Ubuntu chay day du `make setup` + `make check`.
# Windows chay cung bo kiem tra qua scripts/dev.ps1 (AGENTS.md quy tac 10: da nen tang).
# Chua co service Postgres: F01 them khi test chuyen sang TEST_DATABASE_URL.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make check

  windows:
    name: dev.ps1 check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: setup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\dev.ps1 setup
      - name: check (format, lint, typecheck, lint-imports, api types, pytest, vitest, build)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\dev.ps1 check
