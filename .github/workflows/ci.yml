# CI (F00 R13; QA#8). Ubuntu chay day du `make setup` + `make check`.
# Windows chay cung bo kiem tra qua scripts/dev.ps1 (AGENTS.md quy tac 10: da nen tang).
# F01 R11: test chay tren PostgreSQL (TEST_DATABASE_URL, DB postcare_test, rollback moi test).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (ubuntu)
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postcare:postcare@localhost:5432/postcare_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postcare
          POSTGRES_PASSWORD: postcare
          POSTGRES_DB: postcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make check

  windows:
    name: dev.ps1 check (windows)
    runs-on: windows-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postcare:postcare@localhost:5432/postcare_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Windows runner khong ho tro service container: dung PostgreSQL cai san tren image
      # (bien PGBIN, PGUSER, PGPASSWORD do runner dat san).
      - name: start PostgreSQL (preinstalled) and create postcare_test
        shell: pwsh
        run: |
          $pg = Get-Service -Name postgresql*
          Set-Service -InputObject $pg -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" -t 30
          & "$env:PGBIN\psql.exe" -c "CREATE USER postcare WITH PASSWORD 'postcare';"
          & "$env:PGBIN\psql.exe" -c "CREATE DATABASE postcare_test OWNER postcare;"
      - name: setup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\dev.ps1 setup
      - name: check (format, lint, typecheck, lint-imports, api types, pytest, vitest, build)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\dev.ps1 check
